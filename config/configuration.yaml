
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

input_button:
  licht_an:
    name: Licht An

rest:
  # M13 = Istposition Behang (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M13"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Position"
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M14 = Istposition Lamelle (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M14"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Lamelle"
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M22 = Istposition Behang Wohnzimmer Süd (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M22"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Sued Position"
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M23 = Istposition Lamelle Wohnzimmer Süd (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M23"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Sued Lamelle"
        value_template: "{{ value }}"
        unit_of_measurement: "%"

rest_command:
  comexio_set_marker:
    url: "http://192.168.1.127/api/?action=set&marker={{ marker }}&value={{ value }}"
    method: GET
    username: !secret comexio_user
    password: !secret comexio_password

template:
  - cover:
      # Raffstore Wohnzimmer West — gesteuert über Merker (AWL: raffstore_profi.awl)
      # M15 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M16 = Ziel Behang (-1=deaktiviert, 0-100), M17 = Ziel Lamelle
      - name: "Raffstore Wohnzimmer West"
        device_class: shutter
        unique_id: raffstore_wohnzimmer_west
        # Logik: 0=offen (physisch oben), 100=geschlossen (physisch unten)
        # HA: 100=offen, 0=geschlossen → invertieren
        position: "{{ 100 - (states('sensor.raffstore_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M15
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M15
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M15
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M16
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M17
              value: "{{ 100 - tilt }}"
      # Raffstore Wohnzimmer Süd — gesteuert über Merker (AWL: raffstore_profi_sued.awl)
      # M24 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M25 = Ziel Behang (-1=deaktiviert, 0-100), M26 = Ziel Lamelle
      - name: "Raffstore Wohnzimmer Süd"
        device_class: shutter
        unique_id: raffstore_wohnzimmer_sued
        # Logik: 0=offen (physisch oben), 100=geschlossen (physisch unten)
        # HA: 100=offen, 0=geschlossen → invertieren
        position: "{{ 100 - (states('sensor.raffstore_sued_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M24
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M24
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M24
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M25
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_sued_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M26
              value: "{{ 100 - tilt }}"
