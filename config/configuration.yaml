      - name: "Deckenlampe Essbereich Zustand"
        unique_id: deckenlampe_essbereich_zustand
        value_template: "{{ value | int(0) > 0 }}"
  # M31 = Istposition Behang Essbereich (0–100), aktualisiert vom AWL-Script
