light:
  - platform: group
    name: "LED Spots Küche"
    unique_id: led_spots_kueche_gruppe
    entities:
      - light.led_spots_kuche_vorne
      - light.led_spots_kuche_hinten

cover:
  - platform: group
    name: "Raffstores Wohnzimmer"
    unique_id: raffstores_wohnzimmer_gruppe
    entities:
      - cover.raffstore_wohnzimmer_west
      - cover.raffstore_wohnzimmer_sued
