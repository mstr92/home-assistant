              value: "{{ [((brightness | default(255)) / 255 * 100) | int, 1] | max }}"
        turn_off:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q1"
              value: 0
        set_level:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q1"
              value: "{{ (brightness / 255 * 100) | int }}"
      # LED Spots Essbereich — Universal-Dimmer Q2
      - name: "LED Spots Essbereich"
        unique_id: led_spots_essbereich
        state: "{{ states('sensor.led_spots_essbereich_helligkeit') | int(0) > 0 }}"
        level: "{{ (states('sensor.led_spots_essbereich_helligkeit') | float(0) / 100 * 255) | int }}"
        turn_on:
          - action: rest_command.comexio_set_ext
