  # M40 = Istposition Behang Küche Ost (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M40"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Kueche Ost Position"
        unique_id: raffstore_kueche_ost_position_m40
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M41 = Istposition Lamelle Küche Ost (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M41"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Kueche Ost Lamelle"
        unique_id: raffstore_kueche_ost_lamelle_m41
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M49 = Istposition Behang Küche Süd (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M49"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Kueche Sued Position"
        unique_id: raffstore_kueche_sued_position_m49
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M50 = Istposition Lamelle Küche Süd (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M50"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Kueche Sued Lamelle"
        unique_id: raffstore_kueche_sued_lamelle_m50
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M22 = Istposition Behang Wohnzimmer Süd (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M22"
