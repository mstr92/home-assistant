
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

input_button:
  licht_an:
    name: Licht An

input_number:
  # Tilt position per blind (0=closed, 100=open). Add one per blind.
  aussenjalousie_tilt:
    name: Aussenjalousie Tilt
    min: 0
    max: 100
    step: 1
    initial: 0

rest:
  # Reads blind position from Comexio marker (updated by AWL script)
  - resource: "http://192.168.1.127/api/?action=get&marker=M10"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Aussenjalousie Position"
        value_template: "{{ value }}"
        unit_of_measurement: "%"

rest_command:
  # Generic Comexio API — set any IO point.
  comexio_set_io:
    url: "http://192.168.1.127/api/?action=set&ext={{ ext }}&io={{ io }}&value={{ value }}"
    method: GET
    username: !secret comexio_user
    password: !secret comexio_password
  # Set a Comexio marker value.
  comexio_set_marker:
    url: "http://192.168.1.127/api/?action=set&marker={{ marker }}&value={{ value }}"
    method: GET
    username: !secret comexio_user
    password: !secret comexio_password

template:
  - cover:
      # --- Aussenjalousie (Q5=up, Q6=down, 38s travel) ---
      - name: "Aussenjalousie"
        device_class: shutter
        unique_id: aussenjalousie
        position: "{{ states('sensor.aussenjalousie_position') | int(0) }}"
        open_cover:
          - action: script.comexio_set_blind_position
            data:
              position_sensor: sensor.aussenjalousie_position
              target_position: 100
              ext: UniversalAktor
              io_up: Q5
              io_down: Q6
              travel_time: 38
        close_cover:
          - action: script.comexio_set_blind_position
            data:
              position_sensor: sensor.aussenjalousie_position
              target_position: 0
              ext: UniversalAktor
              io_up: Q5
              io_down: Q6
              travel_time: 38
        stop_cover:
          - action: rest_command.comexio_set_io
            data:
              ext: UniversalAktor
              io: Q5
              value: 0
          - action: rest_command.comexio_set_io
            data:
              ext: UniversalAktor
              io: Q6
              value: 0
        set_cover_position:
          - action: script.comexio_set_blind_position
            data:
              position_sensor: sensor.aussenjalousie_position
              target_position: "{{ position }}"
              ext: UniversalAktor
              io_up: Q5
              io_down: Q6
              travel_time: 38
        tilt: "{{ states('input_number.aussenjalousie_tilt') | int(50) }}"
        set_cover_tilt_position:
          - action: script.comexio_set_blind_tilt
            data:
              tilt_entity: input_number.aussenjalousie_tilt
              target_tilt: "{{ tilt }}"
              ext: UniversalAktor
              io_up: Q5
              io_down: Q6
              tilt_time: 1.4

      # To add another blind:
      # 1. Add a REST sensor for the Comexio marker
      # 2. Copy the cover block above and change:
      #    - name, unique_id, position_sensor, io_up, io_down, travel_time
