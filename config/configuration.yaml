rest_command:
  comexio_set_marker:
    url: "http://192.168.1.127/api/?action=set&marker={{ marker }}&value={{ value }}"
    method: GET
    username: !secret comexio_user
    password: !secret comexio_password
  comexio_set_ext:
    url: "http://192.168.1.127/api/?action=set&ext={{ ext }}&io={{ io }}&value={{ value }}"
    method: GET
    username: !secret comexio_user
    password: !secret comexio_password

template:
  - cover:
      # Raffstore Wohnzimmer West — gesteuert über Merker (AWL: raffstore_profi.awl)
      # M15 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M16 = Ziel Behang (-1=deaktiviert, 0-100), M17 = Ziel Lamelle
      - name: "Raffstore Wohnzimmer West"
        device_class: shutter
        unique_id: raffstore_wohnzimmer_west
        # Logik: 0=offen (physisch oben), 100=geschlossen (physisch unten)
        # HA: 100=offen, 0=geschlossen → invertieren
        position: "{{ 100 - (states('sensor.raffstore_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M15
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M15
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M15
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M16
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M17
              value: "{{ 100 - tilt }}"
      # Raffstore Wohnzimmer Süd — gesteuert über Merker (AWL: raffstore_profi_sued.awl)
      # M24 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M25 = Ziel Behang (-1=deaktiviert, 0-100), M26 = Ziel Lamelle
      - name: "Raffstore Wohnzimmer Süd"
        device_class: shutter
        unique_id: raffstore_wohnzimmer_sued
        # Logik: 0=offen (physisch oben), 100=geschlossen (physisch unten)
        # HA: 100=offen, 0=geschlossen → invertieren
        position: "{{ 100 - (states('sensor.raffstore_sued_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M24
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M24
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M24
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M25
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_sued_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M26
              value: "{{ 100 - tilt }}"
      # Raffstore Essbereich — gesteuert über Merker (AWL: raffstore_profi_essbereich.awl)
      # M33 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M34 = Ziel Behang (-1=deaktiviert, 0-100), M35 = Ziel Lamelle
      - name: "Raffstore Essbereich"
        device_class: shutter
        unique_id: raffstore_essbereich
        position: "{{ 100 - (states('sensor.raffstore_essbereich_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M33
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M33
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M33
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M34
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_essbereich_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M35
              value: "{{ 100 - tilt }}"
      # Raffstore Küche Ost — gesteuert über Merker (AWL: raffstore_profi_kueche_ost.awl)
      # M42 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M43 = Ziel Behang (-1=deaktiviert, 0-100), M44 = Ziel Lamelle
      - name: "Raffstore Küche Ost"
        device_class: shutter
        unique_id: raffstore_kueche_ost
        position: "{{ 100 - (states('sensor.raffstore_kueche_ost_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M42
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M42
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M42
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M43
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_kueche_ost_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M44
              value: "{{ 100 - tilt }}"
      # Raffstore Küche Süd — gesteuert über Merker (AWL: raffstore_profi_kueche_sued.awl)
      # M51 = API Befehl (1=Hoch, 2=Runter, 3=Lam.Öffnen, 4=Lam.Schließen, 5=Stop)
      # M52 = Ziel Behang (-1=deaktiviert, 0-100), M53 = Ziel Lamelle
      - name: "Raffstore Küche Süd"
        device_class: shutter
        unique_id: raffstore_kueche_sued
        position: "{{ 100 - (states('sensor.raffstore_kueche_sued_position') | float(0) | round(0) | int) }}"
        open_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M51
              value: 1
        close_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M51
              value: 2
        stop_cover:
          - action: rest_command.comexio_set_marker
            data:
              marker: M51
              value: 5
        set_cover_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M52
              value: "{{ 100 - position }}"
        tilt: "{{ 100 - (states('sensor.raffstore_kueche_sued_lamelle') | float(0) | round(0) | int) }}"
        set_cover_tilt_position:
          - action: rest_command.comexio_set_marker
            data:
              marker: M53
              value: "{{ 100 - tilt }}"
  - light:
      # LED Band Wohnzimmer — Universal-Dimmer Q5
      - name: "LED Band Wohnzimmer"
        unique_id: led_band_wohnzimmer
        state: "{{ states('sensor.led_band_helligkeit') | int(0) > 0 }}"
        level: "{{ (states('sensor.led_band_helligkeit') | float(0) / 100 * 255) | int }}"
        turn_on:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q5"
              value: "{{ [((brightness | default(255)) / 255 * 100) | int, 1] | max }}"
        turn_off:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q5"
              value: 0
        set_level:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q5"
              value: "{{ (brightness / 255 * 100) | int }}"
      # LED Spots Wohnzimmer — Universal-Dimmer Q6
      - name: "LED Spots Wohnzimmer"
        unique_id: led_spots_wohnzimmer
        state: "{{ states('sensor.led_spots_helligkeit') | int(0) > 0 }}"
        level: "{{ (states('sensor.led_spots_helligkeit') | float(0) / 100 * 255) | int }}"
        turn_on:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q6"
              value: "{{ [((brightness | default(255)) / 255 * 100) | int, 1] | max }}"
        turn_off:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q6"
              value: 0
        set_level:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q6"
              value: "{{ (brightness / 255 * 100) | int }}"
      # Deckenlampe Wohnzimmer — IO-Server Q6 (Ein/Aus)
      - name: "Deckenlampe Wohnzimmer"
        unique_id: deckenlampe_wohnzimmer
        state: "{{ states('binary_sensor.deckenlampe_zustand') == 'on' }}"
        turn_on:
          - action: rest_command.comexio_set_ext
            data:
              ext: "IO-Server"
              io: "Q6"
              value: 1
        turn_off:
          - action: rest_command.comexio_set_ext
            data:
              ext: "IO-Server"
              io: "Q6"
              value: 0
      # LED Band Essbereich — Universal-Dimmer Q1
      - name: "LED Band Essbereich"
        unique_id: led_band_essbereich
        state: "{{ states('sensor.led_band_essbereich_helligkeit') | int(0) > 0 }}"
        level: "{{ (states('sensor.led_band_essbereich_helligkeit') | float(0) / 100 * 255) | int }}"
        turn_on:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
