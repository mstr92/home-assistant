
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Overview
      icon: mdi:view-dashboard
      show_in_sidebar: true

input_button:
  licht_an:
    name: Licht An

rest:
  # M13 = Istposition Behang (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M13"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Position"
        unique_id: raffstore_position_m13
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # M14 = Istposition Lamelle (0–100), aktualisiert vom AWL-Script
  - resource: "http://192.168.1.127/api/?action=get&marker=M14"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "Raffstore Lamelle"
        unique_id: raffstore_lamelle_m14
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # LED Band Wohnzimmer — Universal-Dimmer Q5 (0–100%)
  - resource: "http://192.168.1.127/api/?action=get&ext=Universal-Dimmer&io=Q5"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "LED Band Helligkeit"
        unique_id: led_band_helligkeit
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # LED Spots Wohnzimmer — Universal-Dimmer Q6 (0–100%)
  - resource: "http://192.168.1.127/api/?action=get&ext=Universal-Dimmer&io=Q6"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "LED Spots Helligkeit"
        unique_id: led_spots_helligkeit
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # Deckenlampe Wohnzimmer — IO-Server Q6 (0/1)
  - resource: "http://192.168.1.127/api/?action=get&ext=IO-Server&io=Q6"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    binary_sensor:
      - name: "Deckenlampe Zustand"
        unique_id: deckenlampe_zustand
        value_template: "{{ value | int(0) > 0 }}"
  # LED Spots Küche vorne — Universal-Dimmer Q3 (0–100%)
  - resource: "http://192.168.1.127/api/?action=get&ext=Universal-Dimmer&io=Q3"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "LED Spots Kueche Vorne Helligkeit"
        unique_id: led_spots_kueche_vorne_helligkeit
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # LED Spots Küche hinten — Universal-Dimmer Q4 (0–100%)
  - resource: "http://192.168.1.127/api/?action=get&ext=Universal-Dimmer&io=Q4"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "LED Spots Kueche Hinten Helligkeit"
        unique_id: led_spots_kueche_hinten_helligkeit
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # LED Band Essbereich — Universal-Dimmer Q1 (0–100%)
  - resource: "http://192.168.1.127/api/?action=get&ext=Universal-Dimmer&io=Q1"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "LED Band Essbereich Helligkeit"
        unique_id: led_band_essbereich_helligkeit
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # LED Spots Essbereich — Universal-Dimmer Q2 (0–100%)
  - resource: "http://192.168.1.127/api/?action=get&ext=Universal-Dimmer&io=Q2"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
    sensor:
      - name: "LED Spots Essbereich Helligkeit"
        unique_id: led_spots_essbereich_helligkeit
        value_template: "{{ value }}"
        unit_of_measurement: "%"
  # Deckenlampe Essbereich — IO-Server Q7 (0/1)
  - resource: "http://192.168.1.127/api/?action=get&ext=IO-Server&io=Q7"
    username: !secret comexio_user
    password: !secret comexio_password
    scan_interval: 1
