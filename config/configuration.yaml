              value: 0
        set_level:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q2"
              value: "{{ (brightness / 255 * 100) | int }}"
      # LED Spots Küche vorne — Universal-Dimmer Q3
      - name: "LED Spots Küche Vorne"
        unique_id: led_spots_kueche_vorne
        state: "{{ states('sensor.led_spots_kueche_vorne_helligkeit') | int(0) > 0 }}"
        level: "{{ (states('sensor.led_spots_kueche_vorne_helligkeit') | float(0) / 100 * 255) | int }}"
        turn_on:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q3"
              value: "{{ [((brightness | default(255)) / 255 * 100) | int, 1] | max }}"
        turn_off:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q3"
              value: 0
        set_level:
          - action: rest_command.comexio_set_ext
            data:
              ext: "Universal-Dimmer"
              io: "Q3"
              value: "{{ (brightness / 255 * 100) | int }}"
      # LED Spots Küche hinten — Universal-Dimmer Q4
      - name: "LED Spots Küche Hinten"
        unique_id: led_spots_kueche_hinten
        state: "{{ states('sensor.led_spots_kueche_hinten_helligkeit') | int(0) > 0 }}"
        level: "{{ (states('sensor.led_spots_kueche_hinten_helligkeit') | float(0) / 100 * 255) | int }}"
