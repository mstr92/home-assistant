# M13 = Istposition Behang (0–100), aktualisiert vom AWL-Script
- resource: "http://192.168.1.127/api/?action=get&marker=M13"
  username: !secret comexio_user
  password: !secret comexio_password
  scan_interval: 1
  sensor:
    - name: "Raffstore Position"
      unique_id: raffstore_position_m13
      value_template: "{{ value.split(':')[0] | int(0) }}"
      unit_of_measurement: "%"
