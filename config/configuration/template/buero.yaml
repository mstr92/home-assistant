- cover:
    # Rolladen Büro — gesteuert über Merker (AWL: rolladen_buero.awl)
    # M77 = API Befehl (1=Hoch, 2=Runter, 5=Stop)
    # M78 = Ziel Position (-1=deaktiviert, 0-100)
    - name: "Rolladen Büro"
      device_class: shutter
      unique_id: rolladen_buero
      position: "{{ 100 - (states('sensor.rolladen_buro_position') | float(0) | round(0) | int) }}"
      open_cover:
        - action: rest_command.comexio_set_marker
          data:
            marker: M77
            value: 1
      close_cover:
        - action: rest_command.comexio_set_marker
          data:
            marker: M77
            value: 2
      stop_cover:
        - action: rest_command.comexio_set_marker
          data:
            marker: M77
            value: 5
      set_cover_position:
        - action: rest_command.comexio_set_marker
          data:
            marker: M78
            value: "{{ 100 - position }}"
